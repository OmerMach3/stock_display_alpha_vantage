spring.application.name=finansal_deneme
financial.api.url=https://www.alphavantage.co/query

# App first looks at `financial.api.key`; if missing, it uses this env variable.
# PowerShell example (for a temporary session):
# $env:FINANCIAL_API_KEY = 'put_your_api_key_here'
financial.api.key=${FINANCIAL_API_KEY:}

# AlphaVantage API Rate Limiting
# Free tier: 25 API requests per day (updated policy as of 2024)
# Our scheduler respects this with 15 second intervals to spread out the calls

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/stocks?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Network Configuration - force IPv4
# Telling Java to favor IPv4 over IPv6
server.address=0.0.0.0
server.port=8080

# WebClient timeout settings (for network issues)
spring.webflux.base-path=/
logging.level.reactor.netty=DEBUG

# Async Configuration - Thread Pool Settings
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=500
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=async-

# Performance monitoring
management.endpoints.web.exposure.include=health,metrics,threaddump
management.endpoint.health.show-details=always

# Scheduler Configuration
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=scheduler-

# Cache Configuration - Disable Redis, use simple in-memory cache
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=simple
